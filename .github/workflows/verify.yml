name: Track B verification and live demo evidence
on:
  push:
    paths:
      - 'analyze.py'
      - 'test_analyzer.py'
      - '.github/workflows/verify.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify-and-demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run unit tests
        run: python -m unittest -v test_analyzer
      - name: Analyze two public repositories
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p demos
          python analyze.py https://github.com/psf/requests --json demos/requests.json > demos/requests.txt
          python analyze.py https://github.com/pallets/flask --json demos/flask.json > demos/flask.txt
          {
            echo "# Track B real demonstration reports"
            echo ""
            echo "Generated by GitHub Actions from the live GitHub REST API; no hand-edited metrics."
            echo ""
            echo "- [Requests terminal report](requests.txt)"
            echo "- [Flask terminal report](flask.txt)"
            echo "- [Requests JSON](requests.json)"
            echo "- [Flask JSON](flask.json)"
          } > demos/README.md
      - name: Commit actual demo evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add demos/
          if ! git diff --cached --quiet; then
            git commit -m "evidence: real GitHub API demo reports for Requests and Flask"
            git push
          fi
      - name: Upload demo artifact
        uses: actions/upload-artifact@v4
        with:
          name: track-b-live-demos
          path: demos/
